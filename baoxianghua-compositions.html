<!doctype html><html lang="en" data-skin="paper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baoxianghua composition library</title><style>
:root{--field:#ded9ce;--ink:#363b3c;--line:#8c8f88;--a:url('./assets/editorial/baoxianghua/generated/04-scroll-rosette.png');--b:url('./assets/editorial/baoxianghua/generated/06-simple-rosette.png');--c:url('./assets/editorial/baoxianghua/generated/08-cloud-medallion.png');--d:url('./assets/editorial/baoxianghua/generated/09-beaded-medallion.png');--e:url('./assets/editorial/baoxianghua/generated/05-layered-rosette.png');--f:url('./assets/editorial/baoxianghua/generated/07-petal-wheel.png');font-family:Arial,sans-serif;color:#252622;background:var(--field)}*{box-sizing:border-box}body{margin:0;padding:36px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:34px}h1{margin:0;font:500 clamp(34px,5vw,68px)/1 Georgia,serif}p{max-width:48ch;margin:0;color:#62645f}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.tile{position:relative;overflow:hidden;min-height:380px;background:#e8e3d866}.tile h2{position:absolute;z-index:3;left:22px;bottom:18px;margin:0;font:500 15px/1.2 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.m{position:absolute;display:block;aspect-ratio:1;background:var(--ink);-webkit-mask:var(--mask,var(--a)) center/contain no-repeat;mask:var(--mask,var(--a)) center/contain no-repeat;opacity:.68}.single .m{width:58%;left:21%;top:8%}.pair .m:nth-of-type(1){width:54%;left:12%;top:7%}.pair .m:nth-of-type(2){width:40%;right:8%;bottom:5%;--mask:var(--b);opacity:.45}.triad .m:nth-of-type(1){width:52%;left:24%;top:5%;--mask:var(--d)}.triad .m:nth-of-type(2){width:28%;left:5%;bottom:8%;--mask:var(--b);opacity:.42}.triad .m:nth-of-type(3){width:24%;right:6%;bottom:12%;--mask:var(--c);opacity:.34}.frieze{min-height:270px;grid-column:1/-1}.frieze .m{width:20%;top:3%;opacity:.48}.frieze .m:nth-of-type(1){left:1%;--mask:var(--b)}.frieze .m:nth-of-type(2){left:20%;--mask:var(--e)}.frieze .m:nth-of-type(3){left:40%;--mask:var(--c)}.frieze .m:nth-of-type(4){left:60%;--mask:var(--f)}.frieze .m:nth-of-type(5){left:79%;--mask:var(--a)}.bleed .m{width:86%;right:-31%;top:-18%;--mask:var(--c);opacity:.58}.corners .m{width:46%;opacity:.42}.corners .m:nth-of-type(1){left:-20%;top:-22%;--mask:var(--d)}.corners .m:nth-of-type(2){right:-18%;bottom:-24%;--mask:var(--b)}.nested .m:nth-of-type(1){width:69%;left:15%;top:0;--mask:var(--d);opacity:.3}.nested .m:nth-of-type(2){width:43%;left:28%;top:20%;--mask:var(--a);opacity:.75}.constellation .m:nth-of-type(1){width:46%;left:28%;top:4%;--mask:var(--e);opacity:.62}.constellation .m:nth-of-type(2){width:27%;left:7%;bottom:7%;--mask:var(--f);opacity:.42}.constellation .m:nth-of-type(3){width:24%;right:8%;bottom:10%;--mask:var(--c);opacity:.34}.constellation .m:nth-of-type(4){width:15%;right:11%;top:8%;--mask:var(--b);opacity:.28}@media(max-width:760px){body{padding:20px}.grid{grid-template-columns:1fr}.frieze{grid-column:auto}header{align-items:start;flex-direction:column;gap:14px}.tile{min-height:320px}}
</style></head><body><header><h1>Pure medallions</h1><p>Eight reusable arrangements across six complete, front-facing Baoxianghua emblems.</p></header><main class="grid"><section class="tile single"><i class="m"></i><h2>01 / Single seal</h2></section><section class="tile pair"><i class="m"></i><i class="m"></i><h2>02 / Offset pair</h2></section><section class="tile triad"><i class="m"></i><i class="m"></i><i class="m"></i><h2>03 / Primary triad</h2></section><section class="tile frieze"><i class="m"></i><i class="m"></i><i class="m"></i><i class="m"></i><i class="m"></i><h2>04 / Medallion register</h2></section><section class="tile bleed"><i class="m"></i><h2>05 / Edge bleed</h2></section><section class="tile corners"><i class="m"></i><i class="m"></i><h2>06 / Opposed corners</h2></section><section class="tile nested"><i class="m"></i><i class="m"></i><h2>07 / Nested seal</h2></section><section class="tile constellation"><i class="m"></i><i class="m"></i><i class="m"></i><i class="m"></i><h2>08 / Asymmetric constellation</h2></section></main></body></html>
